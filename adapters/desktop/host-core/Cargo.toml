[package]
name = "holonomy-desktop-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
libc = "0.2"
base64 = "0.22"
ring = "=0.17.14"
subtle = "=2.6.1"
zeroize = "=1.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks", "limits"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
